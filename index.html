<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Terminal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: #00ff66;
      font-family: "Courier New", monospace;
      height: 100vh;
      overflow: hidden;
    }

    .terminal {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #050505;
    }

    /* Header */
    .header {
      height: 45px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      background: #111;
      border-bottom: 1px solid #222;
      color: #00ff66;
      font-weight: bold;
    }

    .lights {
      display: flex;
      gap: 7px;
      margin-right: 15px;
    }

    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .red {
      background: #ff3b30;
    }

    .yellow {
      background: #ffcc00;
    }

    .green {
      background: #28c840;
    }

    /* Terminal output */
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .line {
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .command {
      color: #ffffff;
    }

    .success {
      color: #00ff66;
    }

    .error {
      color: #ff4444;
    }

    .info {
      color: #00ccff;
    }

    .muted {
      color: #777;
    }

    /* Media viewer */
    #viewer {
      display: none;
      position: relative;
      padding: 15px;
      border-top: 1px solid #222;
      background: #000;
      text-align: center;
      max-height: 65vh;
      overflow: auto;
    }

    #viewer img {
      max-width: 100%;
      max-height: 55vh;
      object-fit: contain;
    }

    #viewer video {
      width: 100%;
      max-height: 55vh;
      background: #000;
    }

    .viewer-title {
      color: #00ff66;
      margin-bottom: 10px;
      text-align: left;
    }

    /* Command input */
    .input-area {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-top: 1px solid #222;
      background: #090909;
    }

    .prompt {
      color: #00ff66;
      margin-right: 8px;
      font-weight: bold;
    }

    #commandInput {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 16px;
    }

    #commandInput::placeholder {
      color: #555;
    }

    @media (max-width: 600px) {
      #output {
        padding: 12px;
      }

      #viewer {
        max-height: 55vh;
      }

      #viewer video {
        max-height: 45vh;
      }

      #viewer img {
        max-height: 45vh;
      }

      #commandInput {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<div class="terminal">

  <!-- Terminal Header -->
  <div class="header">
    <div class="lights">
      <span class="light red"></span>
      <span class="light yellow"></span>
      <span class="light green"></span>
    </div>
    MEDIA TERMINAL
  </div>

  <!-- Terminal Output -->
  <div id="output"></div>

  <!-- Media Viewer -->
  <div id="viewer"></div>

  <!-- Command Input -->
  <div class="input-area">
    <span class="prompt">user@media:~$</span>
    <input
      type="text"
      id="commandInput"
      placeholder="Type a command..."
      autocomplete="off"
      autofocus
    >
  </div>

</div>

<script>
  const output = document.getElementById("output");
  const input = document.getElementById("commandInput");
  const viewer = document.getElementById("viewer");

  let commandHistory = [];
  let historyIndex = -1;

  function print(text, className = "") {
    const line = document.createElement("div");
    line.className = "line " + className;
    line.textContent = text;
    output.appendChild(line);

    output.scrollTop = output.scrollHeight;
  }

  function printCommand(command) {
    const line = document.createElement("div");
    line.className = "line command";
    line.textContent = "user@media:~$ " + command;
    output.appendChild(line);
  }

  function showWelcome() {
    print("MEDIA TERMINAL", "success");
    print("--------------------------------");
    print("Welcome to your media viewer.");
    print("");
    print("Available commands:", "info");
    print("  video.mp4   → Open video");
    print("  image.jpg   → Open image");
    print("  help        → Show commands");
    print("  clear       → Clear terminal");
    print("  close       → Close media viewer");
    print("");
    print("Type a filename or command and press Enter.");
    print("");
  }

  function openVideo(filename) {
    viewer.innerHTML = "";

    const title = document.createElement("div");
    title.className = "viewer-title";
    title.textContent = "▶ " + filename;

    const video = document.createElement("video");
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;

    const source = document.createElement("source");
    source.src = filename;
    source.type = "video/mp4";

    video.appendChild(source);

    viewer.appendChild(title);
    viewer.appendChild(video);

    viewer.style.display = "block";

    video.play().catch(() => {
      // Browser may block autoplay until user interacts.
    });

    print("Opening " + filename + "...", "success");
  }

  function openImage(filename) {
    viewer.innerHTML = "";

    const title = document.createElement("div");
    title.className = "viewer-title";
    title.textContent = "🖼 " + filename;

    const image = document.createElement("img");
    image.src = filename;
    image.alt = filename;

    image.onerror = function () {
      viewer.style.display = "none";
      print("Error: " + filename + " was not found.", "error");
    };

    viewer.appendChild(title);
    viewer.appendChild(image);

    viewer.style.display = "block";

    print("Opening " + filename + "...", "success");
  }

  function closeViewer() {
    viewer.innerHTML = "";
    viewer.style.display = "none";
    print("Media viewer closed.", "info");
  }

  function showHelp() {
    print("");
    print("AVAILABLE COMMANDS", "info");
    print("--------------------------------");
    print("video.mp4    Open and play video");
    print("image.jpg    Display image");
    print("help         Show this help menu");
    print("clear        Clear terminal history");
    print("close        Close current media");
    print("");
  }

  function executeCommand(command) {
    command = command.trim();

    if (!command) return;

    commandHistory.push(command);
    historyIndex = commandHistory.length;

    printCommand(command);

    const lowerCommand = command.toLowerCase();

    if (lowerCommand === "help") {
      showHelp();
      return;
    }

    if (lowerCommand === "clear") {
      output.innerHTML = "";
      return;
    }

    if (lowerCommand === "close") {
      closeViewer();
      return;
    }

    /*
      Video commands
    */
    if (
      lowerCommand === "video.mp4" ||
      lowerCommand === "video"
    ) {
      openVideo("video.mp4");
      return;
    }

    /*
      Image commands
    */
    if (
      lowerCommand === "image.jpg" ||
      lowerCommand === "image"
    ) {
      openImage("image.jpg");
      return;
    }

    /*
      Direct filename support
      Allows other uploaded media files.
    */

    const videoExtensions = [
      ".mp4",
      ".webm",
      ".ogg",
      ".mov"
    ];

    const imageExtensions = [
      ".jpg",
      ".jpeg",
      ".png",
      ".gif",
      ".webp",
      ".svg"
    ];

    if (videoExtensions.some(ext => lowerCommand.endsWith(ext))) {
      openVideo(command);
      return;
    }

    if (imageExtensions.some(ext => lowerCommand.endsWith(ext))) {
      openImage(command);
      return;
    }

    print(
      "Command not found: " + command +
      ". Type 'help' for available commands.",
      "error"
    );
  }

  input.addEventListener("keydown", function(event) {

    /*
      Enter = execute command
    */
    if (event.key === "Enter") {
      executeCommand(input.value);
      input.value = "";
      return;
    }

    /*
      Arrow Up = previous command
    */
    if (event.key === "ArrowUp") {
      if (commandHistory.length === 0) return;

      historyIndex--;

      if (historyIndex < 0) {
        historyIndex = 0;
      }

      input.value = commandHistory[historyIndex];

      setTimeout(() => {
        input.setSelectionRange(
          input.value.length,
          input.value.length
        );
      }, 0);
    }

    /*
      Arrow Down = next command
    */
    if (event.key === "ArrowDown") {
      if (commandHistory.length === 0) return;

      historyIndex++;

      if (historyIndex >= commandHistory.length) {
        historyIndex = commandHistory.length;
        input.value = "";
        return;
      }

      input.value = commandHistory[historyIndex];
    }
  });

  /*
    Keep terminal focused when user taps the screen.
  */
  document.addEventListener("click", function(event) {
    if (event.target.tagName !== "VIDEO" &&
        event.target.tagName !== "INPUT") {
      input.focus();
    }
  });

  /*
    Start terminal
  */
  showWelcome();

</script>

</body>
  </html>
