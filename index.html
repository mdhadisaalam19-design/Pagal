<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Terminal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      overflow: hidden;
    }

    body {
      color: #00ff66;
      font-family: "Courier New", monospace;
    }

    .terminal {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #050505;
    }

    /* HEADER */
    .header {
      height: 46px;
      min-height: 46px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      background: #111;
      border-bottom: 1px solid #222;
      color: #00ff66;
      font-weight: bold;
    }

    .lights {
      display: flex;
      gap: 7px;
      margin-right: 15px;
    }

    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .red {
      background: #ff3b30;
    }

    .yellow {
      background: #ffcc00;
    }

    .green {
      background: #28c840;
    }

    /* TERMINAL OUTPUT */
    #output {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .line {
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .command {
      color: #fff;
    }

    .success {
      color: #00ff66;
    }

    .error {
      color: #ff4444;
    }

    .info {
      color: #00ccff;
    }

    .emoji {
      font-size: 70px;
      line-height: 1.2;
      margin: 15px 0;
    }

    /* MEDIA VIEWER */
    #viewer {
      display: none;
      position: relative;
      padding: 15px;
      border-top: 1px solid #222;
      background: #000;
      text-align: center;
      max-height: 65vh;
      overflow: auto;
    }

    .viewer-title {
      color: #00ff66;
      margin-bottom: 10px;
      text-align: left;
      font-weight: bold;
    }

    #viewer img {
      display: block;
      margin: auto;
      max-width: 100%;
      max-height: 55vh;
      object-fit: contain;
    }

    #viewer video {
      display: block;
      width: 100%;
      max-height: 55vh;
      background: #000;
    }

    /* COMMAND INPUT */
    .input-area {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-top: 1px solid #222;
      background: #090909;
    }

    .prompt {
      color: #00ff66;
      margin-right: 8px;
      font-weight: bold;
      white-space: nowrap;
    }

    #commandInput {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
    }

    #commandInput::placeholder {
      color: #555;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      #output {
        padding: 12px;
      }

      .input-area {
        padding: 11px;
      }

      .prompt {
        font-size: 13px;
      }

      #commandInput {
        font-size: 14px;
      }

      #viewer {
        max-height: 55vh;
      }

      #viewer video,
      #viewer img {
        max-height: 45vh;
      }
    }
  </style>
</head>

<body>

<div class="terminal">

  <!-- HEADER -->
  <div class="header">
    <div class="lights">
      <span class="light red"></span>
      <span class="light yellow"></span>
      <span class="light green"></span>
    </div>

    MEDIA TERMINAL
  </div>

  <!-- TERMINAL OUTPUT -->
  <div id="output"></div>

  <!-- MEDIA VIEWER -->
  <div id="viewer"></div>

  <!-- COMMAND INPUT -->
  <div class="input-area">
    <span class="prompt">user@media:~$</span>

    <input
      type="text"
      id="commandInput"
      placeholder="Type a command..."
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      autofocus
    >
  </div>

</div>

<script>

  const output = document.getElementById("output");
  const input = document.getElementById("commandInput");
  const viewer = document.getElementById("viewer");

  let commandHistory = [];
  let historyIndex = -1;


  /* PRINT NORMAL TEXT */
  function print(text, className = "") {

    const line = document.createElement("div");

    line.className = "line " + className;

    line.textContent = text;

    output.appendChild(line);

    output.scrollTop = output.scrollHeight;
  }


  /* PRINT COMMAND */
  function printCommand(command) {

    const line = document.createElement("div");

    line.className = "line command";

    line.textContent = "user@media:~$ " + command;

    output.appendChild(line);

    output.scrollTop = output.scrollHeight;
  }


  /* PRINT EMOJI */
  function printEmoji(emoji) {

    const line = document.createElement("div");

    line.className = "line emoji";

    line.textContent = emoji;

    output.appendChild(line);

    output.scrollTop = output.scrollHeight;
  }


  /* WELCOME SCREEN */
  function showWelcome() {

    print("MEDIA TERMINAL", "success");

    print("--------------------------------");

    print("Welcome to your media viewer.");

    print("");

    print("Available commands:", "info");

    print("  video.mp4   → Open video");

    print("  image.jpg   → Open image");

    print("  raju        → ❤️");

    print("  pankaj      → 🖕");

    print("  suraj       → 🤟");

    print("  hadis       → 😎");

    print("  help        → Show commands");

    print("  clear       → Clear terminal");

    print("  close       → Close media");

    print("");

    print("Type a command and press Enter.");

    print("");
  }


  /* OPEN VIDEO */
  function openVideo(filename) {

    viewer.innerHTML = "";

    const title = document.createElement("div");

    title.className = "viewer-title";

    title.textContent = "▶ " + filename;


    const video = document.createElement("video");

    video.controls = true;

    video.autoplay = true;

    video.playsInline = true;


    const source = document.createElement("source");

    source.src = filename;

    source.type = "video/mp4";


    video.appendChild(source);

    viewer.appendChild(title);

    viewer.appendChild(video);

    viewer.style.display = "block";


    video.play().catch(() => {
      // Browser may require user interaction for autoplay.
    });


    print("Opening " + filename + "...", "success");
  }


  /* OPEN IMAGE */
  function openImage(filename) {

    viewer.innerHTML = "";

    const title = document.createElement("div");

    title.className = "viewer-title";

    title.textContent = "🖼 " + filename;


    const image = document.createElement("img");

    image.src = filename;

    image.alt = filename;


    image.onerror = function () {

      viewer.style.display = "none";

      print(
        "Error: " + filename + " was not found.",
        "error"
      );
    };


    viewer.appendChild(title);

    viewer.appendChild(image);

    viewer.style.display = "block";


    print("Opening " + filename + "...", "success");
  }


  /* CLOSE MEDIA */
  function closeViewer() {

    viewer.innerHTML = "";

    viewer.style.display = "none";

    print("Media viewer closed.", "info");
  }


  /* HELP */
  function showHelp() {

    print("");

    print("AVAILABLE COMMANDS", "info");

    print("--------------------------------");

    print("video.mp4    Open and play video");

    print("image.jpg    Display image");

    print("raju         Show heart");

    print("pankaj       Show middle finger");

    print("suraj        Show love sign");

    print("hadis        Show glasses");

    print("help         Show this help menu");

    print("clear        Clear terminal");

    print("close        Close current media");

    print("");

    print("You can also type other image/video filenames.");

    print("");
  }


  /* EXECUTE COMMAND */
  function executeCommand(command) {

    command = command.trim();

    if (!command) {
      return;
    }


    /* SAVE COMMAND HISTORY */

    commandHistory.push(command);

    historyIndex = commandHistory.length;


    /* SHOW COMMAND */

    printCommand(command);


    const lowerCommand = command.toLowerCase();


    /* HELP */

    if (lowerCommand === "help") {

      showHelp();

      return;
    }


    /* CLEAR */

    if (lowerCommand === "clear") {

      output.innerHTML = "";

      return;
    }


    /* CLOSE */

    if (lowerCommand === "close") {

      closeViewer();

      return;
    }


    /* RAJU */

    if (lowerCommand === "raju") {

      printEmoji("❤️");

      return;
    }


    /* PANKAJ */

    if (lowerCommand === "pankaj") {

      printEmoji("🖕");

      return;
    }


    /* SURAJ */

    if (lowerCommand === "suraj") {

      printEmoji("🤟");

      return;
    }


    /* HADIS */

    if (lowerCommand === "hadis") {

      printEmoji("😎");

      return;
    }


    /* VIDEO */

    if (
      lowerCommand === "video.mp4" ||
      lowerCommand === "video"
    ) {

      openVideo("video.mp4");

      return;
    }


    /* IMAGE */

    if (
      lowerCommand === "image.jpg" ||
      lowerCommand === "image"
    ) {

      openImage("image.jpg");

      return;
    }


    /* OTHER VIDEO FILES */

    const videoExtensions = [
      ".mp4",
      ".webm",
      ".ogg",
      ".mov"
    ];


    if (
      videoExtensions.some(
        extension => lowerCommand.endsWith(extension)
      )
    ) {

      openVideo(command);

      return;
    }


    /* OTHER IMAGE FILES */

    const imageExtensions = [
      ".jpg",
      ".jpeg",
      ".png",
      ".gif",
      ".webp",
      ".svg"
    ];


    if (
      imageExtensions.some(
        extension => lowerCommand.endsWith(extension)
      )
    ) {

      openImage(command);

      return;
    }


    /* UNKNOWN COMMAND */

    print(
      "Command not found: " +
      command +
      ". Type 'help' for available commands.",
      "error"
    );
  }


  /* KEYBOARD CONTROLS */

  input.addEventListener("keydown", function(event) {


    /* ENTER */

    if (event.key === "Enter") {

      executeCommand(input.value);

      input.value = "";

      return;
    }


    /* ARROW UP */

    if (event.key === "ArrowUp") {

      if (commandHistory.length === 0) {
        return;
      }


      historyIndex--;


      if (historyIndex < 0) {
        historyIndex = 0;
      }


      input.value = commandHistory[historyIndex];


      setTimeout(() => {

        input.setSelectionRange(
          input.value.length,
          input.value.length
        );

      }, 0);
    }


    /* ARROW DOWN */

    if (event.key === "ArrowDown") {

      if (commandHistory.length === 0) {
        return;
      }


      historyIndex++;


      if (historyIndex >= commandHistory.length) {

        historyIndex = commandHistory.length;

        input.value = "";

        return;
      }


      input.value = commandHistory[historyIndex];
    }

  });


  /* KEEP INPUT FOCUSED */

  document.addEventListener("click", function(event) {

    if (
      event.target.tagName !== "VIDEO" &&
      event.target.tagName !== "INPUT"
    ) {

      input.focus();
    }

  });


  /* START */

  showWelcome();

</script>

</body>
</html>
